services:
  postgres:
    image: postgres:16-alpine
    container_name: pidstudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pidstudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pidstudio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pidstudio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: pidccs-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
      cache_from:
        - pidccs-backend:latest
    container_name: pidstudio-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - APP_ENV
      - DEBUG
      - LOCAL_DEV_AUTH_BYPASS
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pidstudio
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/pidstudio
      - REDIS_URL=redis://redis:6379/0
      - BIMA_BASE_URL
      - BIMA_CLIENT_ID
      - CORS_ORIGINS
      - JWT_SECRET_KEY
      - SUPERUSER_SECRET_KEY
      - BIMA_SSO_MOCK_MODE
      - BIMA_PROJECTS_MOCK_MODE
      - STORAGE_DIR=/app/data/storage
      - WEIGHTS_DIR=/app/runs
      - DETECTOR_IMPL=yolo
      - OCR_IMPL=rapidocr
      - TRACER_IMPL=skeleton
      - PYTHONPATH=/app:/pidcorr:/app/..
      - OMP_NUM_THREADS=1
      - KMP_DUPLICATE_LIB_OK=TRUE
    volumes:
      - ./backend:/app
      - ./pidcorr:/pidcorr
      - ./pidcorr:/app/pidcorr
      - ./runs:/app/runs
      - ./data:/app/data
      - "./Contoh P&ID:/app/Contoh P&ID"
      - ./combined_dataset:/app/combined_dataset
      - ./.pidcache:/app/.pidcache
      - pip_cache:/root/.cache/pip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: pidccs-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
      cache_from:
        - pidccs-backend:latest
    container_name: pidstudio-worker
    restart: unless-stopped
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 -O fair
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pidstudio
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/pidstudio
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/data/storage
      - WEIGHTS_DIR=/app/runs
      - DETECTOR_IMPL=yolo
      - OCR_IMPL=rapidocr
      - TRACER_IMPL=skeleton
      - PYTHONPATH=/app:/pidcorr:/app/..
      - OMP_NUM_THREADS=1
      - KMP_DUPLICATE_LIB_OK=TRUE
    volumes:
      - ./backend:/app
      - ./pidcorr:/pidcorr
      - ./pidcorr:/app/pidcorr
      - ./runs:/app/runs
      - ./data:/app/data
      - "./Contoh P&ID:/app/Contoh P&ID"
      - ./combined_dataset:/app/combined_dataset
      - ./.pidcache:/app/.pidcache
      - pip_cache:/root/.cache/pip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: pidccs-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_BIMA_BASE_URL: ${NEXT_PUBLIC_BIMA_BASE_URL:-}
        NEXT_PUBLIC_BIMA_CLIENT_ID: ${NEXT_PUBLIC_BIMA_CLIENT_ID:-}
        NEXT_PUBLIC_BIMA_REDIRECT_URI: ${NEXT_PUBLIC_BIMA_REDIRECT_URI:-}
        NEXT_PUBLIC_LOCAL_DEV_AUTH_BYPASS: ${NEXT_PUBLIC_LOCAL_DEV_AUTH_BYPASS:-false}
      cache_from:
        - pidccs-frontend:latest
    container_name: pidstudio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  pip_cache:
